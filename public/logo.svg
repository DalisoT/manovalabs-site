<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" fill="none" role="img" aria-label="The Richard Standard">
  <defs>
    <linearGradient id="trs-grad" x1="0" y1="0" x2="320" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B9C7A"/>
      <stop offset="1" stop-color="#5EE5B8"/>
    </linearGradient>
  </defs>
  <text x="0" y="22" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.18em" fill="var(--text-tertiary)">THE</text>
  <text x="0" y="48" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.01em" fill="url(#trs-grad)">Richard Standard</text>
  <line x1="208" y1="44" x2="312" y2="44" stroke="url(#trs-grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <text x="208" y="34" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.15em" fill="var(--text-tertiary)">BUILD. AUTOMATE. EVOLVE.</text>
</svg>
